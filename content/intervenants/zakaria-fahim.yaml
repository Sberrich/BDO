bio: >-
  Expert-comptable et commissaire aux comptes, spécialisé en systèmes d’information, en accompagnement des entreprises familiales et de croissance, en transformation digitale et en audit IT. Président de BDO Maroc et Head of Global Advisory, il conseille les organisations en conformité, contrôle interne, audit financier et stratégies de croissance. Fondateur de Hub Africa, il anime le workshop « Management digital, aspects entrepreneurial et éthique ».
